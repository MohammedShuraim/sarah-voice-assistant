[project]
name = "sarah-voice-assistant"
version = "1.0.0"
description = "A voice assistant powered by Groq's Whisper and Llama models"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
